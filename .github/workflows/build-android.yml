name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
            chmod +x ./gradlew
          fi

      - name: Assemble Debug APK
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          BACKEND="${BACKEND_BASE_URL:-http://10.0.2.2:8000/}"
          YTKEY="${YOUTUBE_API_KEY:-}"
          ./gradlew assembleDebug \
            -PBACKEND_BASE_URL="$BACKEND" \
            -PYOUTUBE_API_KEY="$YTKEY" \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voxtube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
